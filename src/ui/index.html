<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>SF3 Web</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%;
      height: 100%;
      /* 100vh can be taller than what's actually visible once mobile browser
         chrome (address bar) or a WebView's system bars are accounted for.
         100dvh tracks the real, currently-visible viewport instead. */
      height: 100dvh;
      background: #000;
      overflow: hidden;
      /* Kill the blue tap flash on every element */
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
    }

    #render-canvas {
      position: fixed; inset: 0;
      width: 100%; height: 100%;
      width: 100dvw; height: 100dvh;
      display: block; touch-action: none;
    }

    /*
      #ui-viewport: 1280×720 design canvas, scaled to fill the SAFE area.
      We offset by the browser chrome (address bar) using dvh / safe-area-inset.
    */
    #ui-viewport {
      position: fixed;
      width: 1280px;
      height: 720px;
      transform-origin: top left;
      pointer-events: none;
      z-index: 10;
      /* prevent tap highlights inside */
      -webkit-tap-highlight-color: transparent;
    }

    #enter-point-ui {
      position: absolute;
      inset: 0;
      pointer-events: none;
      width: 1280px;
      height: 720px;
    }

    /* Loading screen — real screen size, outside scaler */
    #load-screen {
      display: none;
      position: fixed; inset: 0; z-index: 9999; opacity: 1;
      transition: opacity 0.4s ease;
    }
    #load-screen.active { display: flex; align-items: center; justify-content: center; }
    #load-screen-bg { position: absolute; inset: 0; background: #000; }
    #load-screen-spinner {
      position: relative; z-index: 1;
      width: 56px; height: 56px;
      border: 4px solid rgba(255,255,255,0.15);
      border-top-color: #fff; border-radius: 50%;
      animation: ls-spin 0.8s linear infinite;
    }
    @keyframes ls-spin { to { transform: rotate(360deg); } }
    #load-screen-tip {
      position: absolute; bottom: 52px;
      left: 50%; transform: translateX(-50%);
      color: #aaa; font-size: 14px;
      max-width: 420px; text-align: center;
      font-family: sans-serif; line-height: 1.5; z-index: 1;
    }
  </style>
</head>
<body>
  <canvas id="render-canvas"></canvas>

  <div id="load-screen" style="display:none">
    <div id="load-screen-bg"></div>
    <div id="load-screen-spinner"></div>
    <p id="load-screen-tip"></p>
  </div>

  <div id="ui-viewport">
    <div id="enter-point-ui"></div>
  </div>

  <script>
    (function () {
      var vp = document.getElementById('ui-viewport');
      var W = 1280, H = 720;

      function resize() {
        // Use visualViewport if available — accounts for browser chrome (address bar)
        var vvp = window.visualViewport;
        var winW = vvp ? vvp.width  : window.innerWidth;
        var winH = vvp ? vvp.height : window.innerHeight;

        // Fit mode: scales to CONTAIN the 1280x720 design canvas inside
        // whatever viewport we're given, so nothing is ever cropped —
        // we may get letterbox bars on the non-dominant axis instead.
        var scale = Math.min(winW / W, winH / H);

        var offsetX = (winW - W * scale) / 2;
        var offsetY = (winH - H * scale) / 2;

        // If visualViewport, also account for its offset (chrome bar scroll)
        if (vvp) {
          offsetX += vvp.offsetLeft;
          offsetY += vvp.offsetTop;
        }

        vp.style.transform = 'scale(' + scale + ')';
        vp.style.left = offsetX + 'px';
        vp.style.top  = offsetY + 'px';
      }

      resize();
      window.addEventListener('resize', resize);
      if (window.visualViewport) {
        window.visualViewport.addEventListener('resize', resize);
        window.visualViewport.addEventListener('scroll', resize);
      }
    })();
  </script>
</body>
</html>
