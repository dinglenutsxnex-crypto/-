<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>SF3 Web</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%; height: 100%;
      background: #000;
      overflow: hidden;
      /* Kill the blue tap flash on every element */
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
    }

    #render-canvas {
      position: fixed; inset: 0;
      width: 100%; height: 100%;
      display: block; touch-action: none;
    }

    /*
      #enter-point-ui: the real UI root. No fixed design canvas, no scale
      transform — it IS the device viewport, edge to edge, on every
      aspect ratio. All screens (currency-bar, home-menu, fight-hud) size
      themselves with %, vw/vh, flex, and safe-area insets so they always
      reach the true edges instead of a virtual 1280x720 frame.

      JS below keeps --vvw/--vvh/--vv-top/--vv-left in sync with
      visualViewport, which is the only reliable way to get the REAL
      visible area on mobile browsers/webviews (excludes address bar,
      handles Android/iOS chrome show/hide without clipping content).
    */
    #enter-point-ui {
      position: fixed;
      left: var(--vv-left, 0px);
      top: var(--vv-top, 0px);
      width: var(--vvw, 100vw);
      height: var(--vvh, 100vh);
      pointer-events: none;
      z-index: 10;
      -webkit-tap-highlight-color: transparent;
    }

    /* Loading screen — real screen size, outside the UI root */
    #load-screen {
      display: none;
      position: fixed; inset: 0; z-index: 9999; opacity: 1;
      transition: opacity 0.4s ease;
    }
    #load-screen.active { display: flex; align-items: center; justify-content: center; }
    #load-screen-bg { position: absolute; inset: 0; background: #000; }
    #load-screen-spinner {
      position: relative; z-index: 1;
      width: 56px; height: 56px;
      border: 4px solid rgba(255,255,255,0.15);
      border-top-color: #fff; border-radius: 50%;
      animation: ls-spin 0.8s linear infinite;
    }
    @keyframes ls-spin { to { transform: rotate(360deg); } }
    #load-screen-tip {
      position: absolute; bottom: 52px;
      left: 50%; transform: translateX(-50%);
      color: #aaa; font-size: 14px;
      max-width: 420px; text-align: center;
      font-family: sans-serif; line-height: 1.5; z-index: 1;
    }
  </style>
</head>
<body>
  <canvas id="render-canvas"></canvas>

  <div id="load-screen" style="display:none">
    <div id="load-screen-bg"></div>
    <div id="load-screen-spinner"></div>
    <p id="load-screen-tip"></p>
  </div>

  <div id="enter-point-ui"></div>

  <script>
    (function () {
      var root = document.documentElement;
      var raf = null;

      function apply() {
        var vvp = window.visualViewport;
        var w = vvp ? vvp.width  : window.innerWidth;
        var h = vvp ? vvp.height : window.innerHeight;
        var l = vvp ? vvp.offsetLeft : 0;
        var t = vvp ? vvp.offsetTop  : 0;

        root.style.setProperty('--vvw', w + 'px');
        root.style.setProperty('--vvh', h + 'px');
        root.style.setProperty('--vv-left', l + 'px');
        root.style.setProperty('--vv-top', t + 'px');
      }

      // Coalesce bursts of resize/scroll events (webviews + iOS chrome
      // animating in/out fire many events in a row) into one paint.
      function scheduleApply() {
        if (raf) cancelAnimationFrame(raf);
        raf = requestAnimationFrame(function () {
          raf = null;
          apply();
        });
      }

      apply();
      window.addEventListener('resize', scheduleApply);
      window.addEventListener('orientationchange', function () {
        // Some browsers report stale innerWidth/Height for a beat right
        // after rotation, so re-measure a couple more times as it settles.
        scheduleApply();
        setTimeout(scheduleApply, 100);
        setTimeout(scheduleApply, 300);
      });
      if (window.visualViewport) {
        window.visualViewport.addEventListener('resize', scheduleApply);
        window.visualViewport.addEventListener('scroll', scheduleApply);
      }
      window.addEventListener('load', scheduleApply);
      document.addEventListener('visibilitychange', function () {
        if (!document.hidden) scheduleApply();
      });
    })();
  </script>
</body>
</html>
