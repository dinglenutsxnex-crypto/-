<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SF3 Web</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; background: #000; overflow: hidden; }

    #render-canvas {
      position: fixed; inset: 0;
      width: 100%; height: 100%;
      display: block; touch-action: none;
    }

    /*
      #ui-viewport is a 1280×720 design-space container.
      The inline script below scales + positions it to fill the window
      (like Unity Canvas Scaler "Scale With Screen Size").
      By default it FILLS the screen (like cover), clipping the sides if
      the aspect doesn't match — keeps the bar full-width on widescreen.
      Change Math.max → Math.min if you want letterbox instead.
    */
    #ui-viewport {
      position: fixed;
      width: 1280px;
      height: 720px;
      transform-origin: top left;
      pointer-events: none;
      z-index: 10;
    }

    #enter-point-ui {
      position: absolute;
      inset: 0;
      pointer-events: none;
      width: 1280px;
      height: 720px;
    }

    /* Loading screen — lives outside the scaler, fills real screen */
    #load-screen {
      display: none;
      position: fixed; inset: 0; z-index: 9999; opacity: 1;
      transition: opacity 0.4s ease;
    }
    #load-screen.active { display: flex; align-items: center; justify-content: center; }
    #load-screen-bg { position: absolute; inset: 0; background: #000; }
    #load-screen-spinner {
      position: relative; z-index: 1;
      width: 56px; height: 56px;
      border: 4px solid rgba(255,255,255,0.15);
      border-top-color: #fff; border-radius: 50%;
      animation: ls-spin 0.8s linear infinite;
    }
    @keyframes ls-spin { to { transform: rotate(360deg); } }
    #load-screen-tip {
      position: absolute; bottom: 52px;
      left: 50%; transform: translateX(-50%);
      color: #aaa; font-size: 14px;
      max-width: 420px; text-align: center;
      font-family: sans-serif; line-height: 1.5; z-index: 1;
    }
  </style>
</head>
<body>
  <canvas id="render-canvas"></canvas>

  <div id="load-screen" style="display:none">
    <div id="load-screen-bg"></div>
    <div id="load-screen-spinner"></div>
    <p id="load-screen-tip"></p>
  </div>

  <div id="ui-viewport">
    <div id="enter-point-ui"></div>
  </div>

  <script>
    (function () {
      var vp = document.getElementById('ui-viewport');
      var W = 1280, H = 720;

      function resize() {
        var winW = window.innerWidth;
        var winH = window.innerHeight;

        // "expand" mode: scale up to fill the screen on the dominant axis.
        // This means 16:9 = perfect fill; wider = top/bottom bars fill fine;
        // taller = left/right overflow hidden (like mobile portrait).
        // Swap Math.max for Math.min to get letterbox instead.
        var scale = Math.max(winW / W, winH / H);

        // Centre the scaled canvas
        var offsetX = (winW - W * scale) / 2;
        var offsetY = (winH - H * scale) / 2;

        vp.style.transform = 'scale(' + scale + ')';
        vp.style.left = offsetX + 'px';
        vp.style.top  = offsetY + 'px';

        // Also clip overflow so nothing bleeds outside the browser window
        document.body.style.overflow = 'hidden';
      }

      resize();
      window.addEventListener('resize', resize);
    })();
  </script>
</body>
</html>
