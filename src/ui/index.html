<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SF3 Web</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; background: #000; overflow: hidden; }

    #render-canvas {
      position: fixed; inset: 0;
      width: 100%; height: 100%;
      display: block; touch-action: none;
    }

    /* ── Viewport scaler ─────────────────────────── */
    /* All UI lives inside here at 1280×720 design coords */
    #ui-viewport {
      position: fixed;
      top: 0; left: 0;
      width: 1280px; height: 720px;
      transform-origin: top left;
      /* js sets transform: scale(...) */
      pointer-events: none;
      z-index: 10;
    }

    /* ── Loading screen (lives outside viewport scaler so it fills screen) */
    #load-screen {
      display: none;
      position: fixed; inset: 0; z-index: 9999; opacity: 1;
      transition: opacity 0.4s ease;
    }
    #load-screen.active { display: flex; flex-direction: column; align-items: center; justify-content: center; }
    #load-screen-bg { position: absolute; inset: 0; background: #000; }
    #load-screen-spinner {
      position: relative; z-index: 1;
      width: 56px; height: 56px;
      border: 4px solid rgba(255,255,255,0.15);
      border-top-color: #fff; border-radius: 50%;
      animation: ls-spin 0.8s linear infinite;
    }
    @keyframes ls-spin { to { transform: rotate(360deg); } }
    #load-screen-tip {
      position: absolute; bottom: 52px;
      left: 50%; transform: translateX(-50%);
      color: #aaa; font-size: 14px;
      max-width: 420px; text-align: center;
      font-family: sans-serif; line-height: 1.5; z-index: 1;
    }

    /* enter-point-ui fills the design canvas */
    #enter-point-ui {
      position: absolute; inset: 0;
      pointer-events: none;
      width: 1280px; height: 720px;
    }
  </style>
</head>
<body>
  <canvas id="render-canvas"></canvas>

  <div id="load-screen" style="display:none">
    <div id="load-screen-bg"></div>
    <div id="load-screen-spinner"></div>
    <p id="load-screen-tip"></p>
  </div>

  <div id="ui-viewport">
    <div id="enter-point-ui"></div>
  </div>

  <script>
    (function scaleViewport() {
      var vp = document.getElementById('ui-viewport');
      function resize() {
        var scaleX = window.innerWidth  / 1280;
        var scaleY = window.innerHeight / 720;
        var scale  = Math.min(scaleX, scaleY);
        vp.style.transform = 'scale(' + scale + ')';
        // Centre if letterboxed
        var offsetX = (window.innerWidth  - 1280 * scale) / 2;
        var offsetY = (window.innerHeight - 720  * scale) / 2;
        vp.style.left = offsetX + 'px';
        vp.style.top  = offsetY + 'px';
      }
      resize();
      window.addEventListener('resize', resize);
    })();
  </script>
</body>
</html>
