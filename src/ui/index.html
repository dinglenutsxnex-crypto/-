<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>SF3 Web</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%; height: 100%;
      background: #000;
      overflow: hidden;
      /* Kill the blue tap flash on every element */
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
    }

    #render-canvas {
      position: fixed; inset: 0;
      width: 100%; height: 100%;
      display: block; touch-action: none;
    }

    /*
      #ui-viewport: 1280×720 design canvas, scaled with letterboxing to FIT
      inside whatever real viewport it's opened in (see resize() below).
      Never crops — any leftover space just shows the black background.
    */
    #ui-viewport {
      position: fixed;
      width: 1280px;
      height: 720px;
      transform-origin: top left;
      pointer-events: none;
      z-index: 10;
      /* prevent tap highlights inside */
      -webkit-tap-highlight-color: transparent;
    }

    #enter-point-ui {
      position: absolute;
      inset: 0;
      pointer-events: none;
      width: 1280px;
      height: 720px;
    }

    /* Loading screen — real screen size, outside scaler */
    #load-screen {
      display: none;
      position: fixed; inset: 0; z-index: 9999; opacity: 1;
      transition: opacity 0.4s ease;
    }
    #load-screen.active { display: flex; align-items: center; justify-content: center; }
    #load-screen-bg { position: absolute; inset: 0; background: #000; }
    #load-screen-spinner {
      position: relative; z-index: 1;
      width: 56px; height: 56px;
      border: 4px solid rgba(255,255,255,0.15);
      border-top-color: #fff; border-radius: 50%;
      animation: ls-spin 0.8s linear infinite;
    }
    @keyframes ls-spin { to { transform: rotate(360deg); } }
    #load-screen-tip {
      position: absolute; bottom: 52px;
      left: 50%; transform: translateX(-50%);
      color: #aaa; font-size: 14px;
      max-width: 420px; text-align: center;
      font-family: sans-serif; line-height: 1.5; z-index: 1;
    }
  </style>
</head>
<body>
  <canvas id="render-canvas"></canvas>

  <div id="load-screen" style="display:none">
    <div id="load-screen-bg"></div>
    <div id="load-screen-spinner"></div>
    <p id="load-screen-tip"></p>
  </div>

  <div id="ui-viewport">
    <div id="enter-point-ui"></div>
  </div>

  <script>
    (function () {
      var vp = document.getElementById('ui-viewport');
      var W = 1280, H = 720;
      var raf = null;

      function measure() {
        // visualViewport is the source of truth when present: it excludes
        // browser chrome (address bar / nav bar) and updates correctly
        // inside webviews and iOS Safari where innerWidth/innerHeight lag
        // or include chrome that overlaps the page.
        var vvp = window.visualViewport;
        var winW = vvp ? vvp.width  : window.innerWidth;
        var winH = vvp ? vvp.height : window.innerHeight;
        var offX = vvp ? vvp.offsetLeft : 0;
        var offY = vvp ? vvp.offsetTop  : 0;
        return { winW: winW, winH: winH, offX: offX, offY: offY };
      }

      function resize() {
        var m = measure();

        // FIT mode (contain): scale so the whole 1280x720 design fits
        // inside the real viewport on BOTH axes. Never crops. Whatever
        // axis has leftover space just letterboxes with the body's
        // black background — no hardcoded ratio, works on any device.
        var scale = Math.min(m.winW / W, m.winH / H);

        var offsetX = (m.winW - W * scale) / 2 + m.offX;
        var offsetY = (m.winH - H * scale) / 2 + m.offY;

        vp.style.transform = 'scale(' + scale + ')';
        vp.style.left = offsetX + 'px';
        vp.style.top  = offsetY + 'px';
      }

      // Coalesce bursts of resize/scroll events (webviews + iOS chrome
      // animating in/out fire many events in a row) into one paint.
      function scheduleResize() {
        if (raf) cancelAnimationFrame(raf);
        raf = requestAnimationFrame(function () {
          raf = null;
          resize();
        });
      }

      resize();
      window.addEventListener('resize', scheduleResize);
      window.addEventListener('orientationchange', function () {
        // Some browsers report stale innerWidth/Height for a beat right
        // after rotation, so re-measure a couple more times as it settles.
        scheduleResize();
        setTimeout(scheduleResize, 100);
        setTimeout(scheduleResize, 300);
      });
      if (window.visualViewport) {
        window.visualViewport.addEventListener('resize', scheduleResize);
        window.visualViewport.addEventListener('scroll', scheduleResize);
      }
      // Fires once fonts/layout settle after load, and is cheap insurance
      // for webviews that don't fire resize reliably on init.
      window.addEventListener('load', scheduleResize);
      document.addEventListener('visibilitychange', function () {
        if (!document.hidden) scheduleResize();
      });
    })();
  </script>
</body>
</html>
