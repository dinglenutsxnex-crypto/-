<div id="currency-bar">

  <!-- Hamburger / home button -->
  <div id="home-button" class="pointer">
    <div class="sp-menu_icon"></div>
  </div>

  <!-- Player info: name · level · XP bar · chat -->
  <div id="currency-player-info">
    <span id="currency-name">PLAYER</span>
    <span id="currency-level">2</span>
    <div id="currency-xp-bar">
      <div class="sp-progress_empty xp-bg"></div>
      <div class="sp-progress_full xp-fill" id="currency-xp-fill"></div>
    </div>
    <div class="sp-chat" id="currency-chat"></div>
  </div>

  <!-- Currency: bonus · coin · shadow -->
  <div id="currency-coins">
    <div class="currency-item bonus">
      <div class="sp-bonus currency-icon"></div>
      <div class="sp-cross currency-add pointer"></div>
      <span class="currency-value" id="val-bonus">400</span>
    </div>
    <div class="currency-item coin">
      <div class="sp-coin currency-icon"></div>
      <div class="sp-cross currency-add pointer"></div>
      <span class="currency-value" id="val-coin">269</span>
    </div>
    <div class="currency-item shadow">
      <div class="sp-shadow_currency currency-icon"></div>
      <span class="currency-value" id="val-shadow">0</span>
    </div>
  </div>

</div>
