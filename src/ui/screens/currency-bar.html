<div id="currency-bar">
  <div id="currency-player-info">
    <span id="currency-name">PLAYER</span>
    <span id="currency-level">2</span>
    <div id="currency-progress">
      <div class="progress-bg"></div>
      <div class="progress-fill" style="width:87%"></div>
    </div>
    <div id="currency-chat" class="sp-chat"></div>
  </div>
  <div id="currency-coins">
    <div class="currency-item bonus">
      <div class="currency-icon sp-bonus"></div>
      <div class="currency-btn-add sp-cross"></div>
      <span class="currency-value">400</span>
    </div>
    <div class="currency-item coin">
      <div class="currency-icon sp-coin"></div>
      <div class="currency-btn-add sp-cross"></div>
      <span class="currency-value">269</span>
    </div>
    <div class="currency-item shadow">
      <div class="currency-icon sp-shadow"></div>
      <span class="currency-value">0</span>
    </div>
  </div>
</div>
