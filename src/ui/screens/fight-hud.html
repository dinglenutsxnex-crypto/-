<div id="fight-hud">

  <!-- ── Player HP (left) ── -->
  <div id="hud-player" class="hud-side hud-left">
    <div class="hud-name" id="hud-name-player">PLAYER</div>
    <div class="hud-bar-wrap">
      <div class="hud-bar-bg"></div>
      <div class="hud-bar-fade" id="hud-hp-fade-player"></div>
      <div class="hud-bar-fill hud-bar-fill--player" id="hud-hp-player"></div>
    </div>
    <!-- Shadow energy bar (player only) -->
    <div class="hud-bar-wrap hud-shadow-wrap">
      <div class="hud-shadow-bg" id="hud-shadow-bg"></div>
      <div class="hud-shadow-fill" id="hud-shadow-fill"></div>
    </div>
    <div class="hud-rounds" id="hud-rounds-player"></div>
  </div>

  <!-- ── Center: timer + banner ── -->
  <div id="hud-center">
    <div id="hud-timer">99</div>
    <div id="hud-banner" class="hud-banner hidden">
      <span id="hud-banner-text"></span>
    </div>
  </div>

  <!-- ── Enemy HP (right) ── -->
  <div id="hud-enemy" class="hud-side hud-right">
    <div class="hud-name" id="hud-name-enemy">ENEMY</div>
    <div class="hud-bar-wrap hud-bar-wrap--right">
      <div class="hud-bar-bg"></div>
      <div class="hud-bar-fade hud-bar-fade--enemy" id="hud-hp-fade-enemy"></div>
      <div class="hud-bar-fill hud-bar-fill--enemy" id="hud-hp-enemy"></div>
    </div>
    <div class="hud-rounds hud-rounds--right" id="hud-rounds-enemy"></div>
  </div>

  <!-- ── Pause button ── -->
  <div id="hud-pause-btn">
    <div id="hud-pause-sprite"></div>
  </div>

  <!-- ── Controls overlay ── -->
  <div id="hud-controls">

    <!-- Joystick (bottom-left) -->
    <div id="hud-joystick">
      <div id="hud-stick-ring"></div>
      <div id="hud-stick-knob"></div>
    </div>

    <!-- Shadow ability slots (bottom-right, above attack buttons) -->
    <div id="hud-abilities">
      <div class="hud-ability-slot" id="hud-ability-0"></div>
      <div class="hud-ability-slot" id="hud-ability-1"></div>
      <div class="hud-ability-slot" id="hud-ability-2"></div>
    </div>

    <!-- Attack buttons — triangle: shuriken top, fist bottom-left, foot bottom-right -->
    <div id="hud-buttons">
      <div class="hud-atk-btn" id="hud-btn-shuriken" data-action="ranged"></div>
      <div class="hud-atk-btn" id="hud-btn-fist"     data-action="punch"></div>
      <div class="hud-atk-btn" id="hud-btn-foot"     data-action="kick"></div>
    </div>

  </div>

</div>
