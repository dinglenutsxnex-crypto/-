<div id="fight-hud">

  <!-- ── Player HP (left) ── -->
  <div id="hud-player" class="hud-side hud-left">
    <div class="hud-name" id="hud-name-player">PLAYER</div>
    <div class="hud-bar-wrap">
      <div class="hud-bar-bg"></div>
      <div class="hud-bar-fade" id="hud-hp-fade-player"></div>
      <div class="hud-bar-fill" id="hud-hp-player"></div>
    </div>
    <div class="hud-shadow-wrap">
      <div id="hud-shadow-bg"></div>
      <div id="hud-shadow-fill"></div>
    </div>
    <div class="hud-rounds" id="hud-rounds-player"></div>
  </div>

  <!-- ── Center: timer ── -->
  <div id="hud-center">
    <div id="hud-timer">99</div>
  </div>

  <!-- ── Enemy HP (right) ── -->
  <div id="hud-enemy" class="hud-side hud-right">
    <div class="hud-name" id="hud-name-enemy">ENEMY</div>
    <div class="hud-bar-wrap hud-bar-wrap--right">
      <div class="hud-bar-bg"></div>
      <div class="hud-bar-fade hud-bar-fade--right" id="hud-hp-fade-enemy"></div>
      <div class="hud-bar-fill hud-bar-fill--right" id="hud-hp-enemy"></div>
    </div>
    <div class="hud-rounds hud-rounds--right" id="hud-rounds-enemy"></div>
  </div>

  <!-- ── Full-screen banner (ROUND 1 / FIGHT! / KO) ── -->
  <div id="hud-banner" class="hidden">
    <span id="hud-banner-text"></span>
  </div>

  <!-- ════════════════════════════════════════════════════
       Fight controls
       ════════════════════════════════════════════════════ -->
  <div id="hud-controls">

    <!-- ── Joystick (bottom-left) ── -->
    <div id="hud-joystick">
      <div id="hud-stick-ring"></div>
      <div id="hud-stick-knob">
        <div id="hud-stick-arrow"></div>
      </div>
    </div>

    <!-- ── Right control panel (bottom-right) ──
         Normal fight:  shuriken (top) + fist (bottom-left) + foot (bottom-right)
         Dojo/training: dir arrow row also appears above the triangle
                        (add class "dojo-active" to #fight-hud to enable)
    ── -->
    <div id="hud-right-panel">

      <!-- directional tutor arrows — dojo/training only, hidden by default -->
      <div id="hud-dir-row">
        <div class="hud-dir-btn" id="hud-dir-0" data-dir="back"></div>
        <div class="hud-dir-btn" id="hud-dir-1" data-dir="down"></div>
        <div class="hud-dir-btn" id="hud-dir-2" data-dir="up"></div>
        <div class="hud-dir-btn" id="hud-dir-3" data-dir="forward"></div>
      </div>

      <!-- attack triangle — always visible -->
      <div id="hud-attack-area">
        <div class="hud-atk-btn" id="hud-btn-shuriken" data-action="ranged"></div>
        <div class="hud-atk-btn" id="hud-btn-fist"     data-action="punch"></div>
        <div class="hud-atk-btn" id="hud-btn-foot"     data-action="kick"></div>
      </div>

    </div>

  </div>

</div>
